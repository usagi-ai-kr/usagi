name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate repository content
        run: node scripts/validate.mjs

      - name: Validate Agent Skills
        run: |
          for skill in .agents/skills/*; do
            npx --yes skills-ref@0.1.5 validate "$skill"
          done

      - name: Test human-doc checker
        run: node --test scripts/check-human-doc.test.mjs

      - name: Test toolchain doctor
        run: node --test scripts/doctor.test.mjs

      - name: Test architecture checker
        run: node --test scripts/check-layer-deps.test.mjs

      - name: Test E2E result validator
        run: node --test scripts/validate-e2e-result.test.mjs

      - name: Test command runner
        run: node --test scripts/run-command.test.mjs

      - name: Test requirement traceability
        run: node --test scripts/check-requirement-trace.test.mjs

      - name: Test diagram checker
        run: node --test scripts/check-diagrams.test.mjs

      - name: Test test-gate runner
        run: node --test scripts/run-test-gates.test.mjs

      - name: Test E2E reference runner (browser-free)
        run: node --test scripts/e2e-runner.test.mjs

      - name: Run fixture unit gate
        run: node scripts/run-test-gates.mjs --config test/fixtures/test-gates/config.json --only unit --json --evidence-dir tmp/test-gates

      - name: Test hook entrypoint
        run: node --test scripts/hooks/validate.test.mjs

      - name: Check contract metadata
        run: node scripts/check-human-doc.mjs --require-metadata docs/human-writing-contract.md

      - name: Lint DESIGN.md
        run: npx --yes @google/design.md@0.4.0 lint DESIGN.md

      - name: Check shell syntax
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done
